<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS Academy - Code Compiler</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #ffffff; color: #1e293b; display: flex; min-height: 100vh; }
        .sidebar { width: 260px; background-color: #f8fafc; border-right: 1px solid #e2e8f0; padding: 24px; display: flex; flex-direction: column; }
        .brand-title { font-size: 1.6rem; font-weight: 700; color: #4f46e5; margin-bottom: 32px; }
        .nav-menu { list-style: none; display: flex; flex-direction: column; gap: 8px; }
        .nav-item a { text-decoration: none; color: #475569; padding: 12px 16px; border-radius: 8px; font-weight: 600; display: block; }
        .nav-item a:hover, .nav-item.active a { background-color: #4f46e5; color: #ffffff; }
        .main-content { flex: 1; padding: 32px; background-color: #ffffff; }
        .header { border-bottom: 1px solid #e2e8f0; padding-bottom: 16px; margin-bottom: 24px; }
        textarea { width: 100%; height: 250px; padding: 16px; background-color: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; font-family: monospace; font-size: 0.95rem; outline: none; margin-bottom: 16px; }
        .btn-run { background-color: #4f46e5; color: white; padding: 10px 24px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .btn-run:hover { background-color: #4338ca; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <h2 class="brand-title">LMS Academy</h2>
        <ul class="nav-menu">
            <li class="nav-item"><a href="index.html">Dashboard</a></li>
            <li class="nav-item"><a href="course-detail.html">Courses</a></li>
            <li class="nav-item"><a href="exam.html">Exams</a></li>
            <li class="nav-item active"><a href="compiler.html">Compiler</a></li>
            <li class="nav-item"><a href="login.html">Logout</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <div class="header">
            <h2>Online Compiler</h2>
        </div>
        <textarea placeholder="// Write your code here...&#10;public class Main {&#10;    public static void main(String[] args) {&#10;        System.out.println(&quot;Hello, LMS Academy!&quot;);&#10;    }&#10;}"></textarea>
        <button class="btn-run">Run Code</button>
    </main>
</body>
</html>
